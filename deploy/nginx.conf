# Sherpa Model Hub —— Nginx 统一入口（docker compose --profile proxy up -d）
#   浏览器只需访问一个端口：
#     /                -> 前端管理界面
#     /api/...         -> 后端管理/网关接口
#     /ws/...          -> 后端 WebSocket 网关（带 Upgrade 头）
#     /docs /redoc /openapi.json -> 后端自带的 API 文档
upstream hub_backend {
    server backend:8000;
}

upstream hub_frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # 自定义模型可能上传较大的 ONNX 文件（前端上传入口 / 离线 ASR 音频）
    client_max_body_size 4096m;

    # 长连接流式识别需要较长的读超时
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # FastAPI 自带的交互式文档与 OpenAPI schema（否则会被前端路由吃掉返回 404）
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://hub_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://hub_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 下载进度推送需要关闭缓冲
        proxy_buffering off;
        # 模型文件上传直接透传给后端，不落 nginx 本地磁盘
        proxy_request_buffering off;
    }

    location /ws/ {
        proxy_pass http://hub_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://hub_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
