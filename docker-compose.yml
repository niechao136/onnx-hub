# =============================================================================
# Sherpa Model Hub —— 一键部署
#
#   docker compose up -d --build            启动 backend + frontend
#   docker compose --profile proxy up -d    额外启动 Nginx 统一入口（推荐）
#
# 端口：
#   backend  8000  对外网关（WS /ws/asr/{id}、POST /api/tts/{id} 必须直连此端口）
#   frontend 3000  管理界面（/api 由 Next.js rewrites 反代到 backend）
#   nginx    8080  统一入口（/ 前端、/api 与 /ws 反代后端，支持 WS 升级）
# =============================================================================
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        # 构建机无法访问 GitHub 时置为 false，改为运行时挂载 /opt/sherpa-onnx
        INSTALL_SHERPA_ONNX: "true"
    image: sherpa-model-hub-backend:latest
    restart: unless-stopped
    environment:
      HUB_MODEL_DIR: /data/models
      HUB_DATA_DIR: /hubdata
      # 同时运行的模型数量上限（小内存服务器建议 1）
      HUB_MAX_RUNNING_MODELS: "${HUB_MAX_RUNNING_MODELS:-2}"
      HUB_PORT_POOL_START: "${HUB_PORT_POOL_START:-7001}"
      HUB_PORT_POOL_END: "${HUB_PORT_POOL_END:-7099}"
      # 对外网关是否强制校验 API Key
      HUB_REQUIRE_API_KEY: "${HUB_REQUIRE_API_KEY:-true}"
      # 管理接口预留密钥，留空表示管理接口不鉴权
      HUB_ADMIN_KEY: "${HUB_ADMIN_KEY:-}"
      HUB_CORS_ORIGINS: "${HUB_CORS_ORIGINS:-*}"
    volumes:
      - models:/data/models
      - hub-data:/hubdata
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: sherpa-model-hub-frontend:latest
    restart: unless-stopped
    environment:
      # 服务端 rewrites 目标（容器内走服务名）
      BACKEND_URL: http://backend:8000
      # 浏览器访问 WS 时使用的地址前缀；使用 nginx profile 时可留空
      NEXT_PUBLIC_WS_BASE: "${NEXT_PUBLIC_WS_BASE:-}"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

  # 可选统一入口：一个端口同时暴露前端与后端（含 WebSocket 升级）
  nginx:
    image: nginx:alpine
    profiles: ["proxy"]
    restart: unless-stopped
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      - frontend
      - backend

volumes:
  models:
  hub-data:
