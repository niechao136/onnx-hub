# =============================================================================
# Sherpa Model Hub —— 一键部署
#
#   docker compose up -d --build            启动 backend + frontend
#   docker compose --profile proxy up -d    额外启动 Nginx 统一入口（推荐）
#
# 端口（宿主机侧，默认值可在 .env 中覆盖）：
#   NGINX_PORT    10100  统一入口（推荐）：/ 前端、/api 与 /ws 反代后端，支持 WebSocket 升级
#   BACKEND_PORT  8000   后端直连（调试 / Swagger：/docs）
#   FRONTEND_PORT 3000   前端直连（调试）
#
# 提示：默认端口在部分机器上可能已被占用（如 3000/8000），生产部署请显式在 .env 中指定，
# 例如本项目服务器上的配置为 NGINX_PORT=10100、BACKEND_PORT=18000、FRONTEND_PORT=18001。
# =============================================================================
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        # 构建机无法访问 GitHub 时置为 false，改为运行时挂载 /opt/sherpa-onnx
        INSTALL_SHERPA_ONNX: "true"
    image: sherpa-model-hub-backend:latest
    restart: unless-stopped
    environment:
      HUB_MODEL_DIR: /data/models
      HUB_DATA_DIR: /hubdata
      # 同时运行的模型数量上限（小内存服务器建议 1）
      HUB_MAX_RUNNING_MODELS: "${HUB_MAX_RUNNING_MODELS:-2}"
      HUB_PORT_POOL_START: "${HUB_PORT_POOL_START:-7001}"
      HUB_PORT_POOL_END: "${HUB_PORT_POOL_END:-7099}"
      # 对外网关是否强制校验 API Key
      HUB_REQUIRE_API_KEY: "${HUB_REQUIRE_API_KEY:-true}"
      # 管理接口预留密钥，留空表示管理接口不鉴权
      HUB_ADMIN_KEY: "${HUB_ADMIN_KEY:-}"
      HUB_CORS_ORIGINS: "${HUB_CORS_ORIGINS:-*}"
    volumes:
      - models:/data/models
      - hub-data:/hubdata
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # NEXT_PUBLIC_* 会被内联进前端产物，必须构建期注入（运行时 environment 无效）。
        # 留空 = 浏览器走同源 /ws，配合 nginx 入口时无需配置。
        NEXT_PUBLIC_WS_BASE: "${NEXT_PUBLIC_WS_BASE:-}"
    image: sherpa-model-hub-frontend:latest
    restart: unless-stopped
    environment:
      # 服务端 rewrites 目标（容器内走服务名）
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

  # 可选统一入口：一个端口同时暴露前端与后端（含 WebSocket 升级）
  nginx:
    image: nginx:alpine
    profiles: ["proxy"]
    restart: unless-stopped
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_PORT:-10100}:80"
    depends_on:
      - frontend
      - backend

volumes:
  models:
  hub-data:
